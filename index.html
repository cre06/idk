<!DOCTYPE html>
<html lang="it" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Hub — Serate in Scatola</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script defer src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{
  --bg:#0b0b13;--sfc:#151521;--bd:rgba(255,255,255,.1);--txt:#f4f4fa;--mut:#9c9db4;
  --acc:#ffb020;--acc-ink:#1d1300;--acc2:#8b5cf6;--good:#34d399;--bad:#fb7185;--warn:#fbbf24;
  color-scheme:dark
}
html[data-mode=light]{
  --bg:#f4f3fa;--sfc:#fff;--bd:rgba(25,25,60,.12);--txt:#14142b;--mut:#64647f;
  --acc:#f59e0b;--acc-ink:#2a1a00;color-scheme:light
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--mut)}.small{font-size:.75rem}.bold{font-weight:800}
.display{font-family:'Outfit',system-ui,sans-serif}
.stack{display:flex;flex-direction:column;gap:.75rem}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.between{justify-content:space-between}.center{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.55rem .9rem;min-height:40px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--txt);font-weight:700;font-size:.82rem;transition:transform .1s}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:scale(.94)}
.btn-primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn-lg{min-height:52px;font-size:1rem;border-radius:14px}
.btn-block{width:100%}
.btn-sm{min-height:30px;padding:.25rem .55rem;font-size:.72rem;border-radius:8px}
.inp{width:100%;padding:.6rem .8rem;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.03);color:var(--txt);font-size:.9rem}
.inp:focus{outline:none;border-color:var(--acc)}
.panel{background:var(--sfc);border:1px solid var(--bd);border-radius:16px;padding:1rem}
.panel-title{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--mut);margin-bottom:.7rem}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.3s;z-index:250;padding:.65rem 1.1rem;border-radius:14px;background:var(--sfc);border:1px solid var(--bd);font-size:.85rem;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--sfc);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.bar-in{max-width:1320px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.logo{font-family:'Outfit',sans-serif;font-weight:900;font-size:1rem;padding:.4rem .85rem;border-radius:12px;color:var(--acc-ink);background:linear-gradient(90deg,var(--acc),#ffe18c,var(--acc));background-size:200% 100%;animation:shine 4s linear infinite;white-space:nowrap}
@keyframes shine{to{background-position:-200% 0}}
/* MENU */
#menu-screen{flex:1;padding:1rem;overflow-y:auto}
.menu-header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:1rem}
.search{flex:1;min-width:200px}
.filter-pills{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.32rem .7rem;border-radius:999px;border:1px solid var(--bd);background:rgba(255,255,255,.05);font-size:.72rem;font-weight:800;color:var(--mut);cursor:pointer}
.pill.active{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem}
.game-card{display:flex;flex-direction:column;gap:.6rem;padding:1rem;border-radius:16px;border:1px solid var(--bd);background:var(--sfc);text-align:left;transition:transform .2s}
.game-card:hover{transform:translateY(-2px);border-color:var(--acc)}
.game-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.game-card .icon{font-size:2rem}
.game-card h3{font-family:'Outfit',sans-serif;font-weight:800;font-size:1rem;color:var(--acc);margin:0 0 .2rem 0}
.game-card .cat{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.game-card .desc{font-size:.8rem;color:var(--txt);margin-bottom:.6rem;line-height:1.4}
.game-card .meta{font-size:.7rem;color:var(--mut);margin-top:auto}
.btn-game{width:100%;margin-top:.4rem}
/* GAME SCREEN */
#game-screen{flex:1;display:flex;flex-direction:column;position:relative}
#game-header{padding:.6rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:var(--sfc)}
#game-title{font-family:'Outfit',sans-serif;font-weight:900;font-size:1.2rem;color:var(--acc)}
/* QR modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(5,5,12,.75);backdrop-filter:blur(6px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;background:var(--sfc);color:var(--txt);border:1px solid var(--bd);border-radius:20px;overflow:hidden}
.sheet-head{padding:.7rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{font-family:'Outfit',sans-serif;font-weight:800;font-size:1rem;color:var(--acc);margin:0}
.sheet-body{padding:1rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:.8rem}
.qr-box{margin:0 auto;background:#fff;padding:14px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#444;font-size:.85rem;min-width:220px;min-height:220px}
.qr-wrap{text-align:center}
</style>
</head>
<body>

<div id="toast"></div>

<div class="app">
  <header class="topbar">
    <div class="bar-in">
      <div class="logo">🎲 GAME HUB</div>
      <div class="bar-right">
        <button class="btn btn-icon" id="modeBtn" onclick="toggleMode()">🌙</button>
      </div>
    </div>
  </header>

  <!-- MENU -->
  <section id="menu-screen" class="menu">
    <div class="menu-header between">
      <div>
        <div class="logo" style="animation:none;background:transparent;color:inherit;">📋 Seleziona gioco</div>
        <p class="muted small" style="margin-top:.2rem">Tutti i giochi supportano telefoni tramite QR (dove previsto)</p>
      </div>
      <button class="btn btn-primary" onclick="openAbout()">ℹ️ Info</button>
    </div>

    <input type="text" id="gameSearch" class="inp search" placeholder="Cerca gioco…" onkeyup="filterGames()">

    <div class="filter-pills" id="filterPills"></div>

    <div class="games-grid" id="gamesGrid"></div>
  </section>

  <!-- GAME AREA -->
  <div id="game-screen" class="hidden app">
    <header id="game-header" class="topbar">
      <button class="btn btn-sm" onclick="backToMenu()">← Torna al menu</button>
      <div id="game-title" class="bold"></div>
      <div class="bar-right" id="gameHeaderRight"></div>
    </header>
    <div id="game-container" style="flex:1;overflow:auto;padding:1rem;"></div>
  </div>
</div>

<!-- QR / URL Modal -->
<div id="qrModal" class="modal">
  <div class="sheet">
    <div class="sheet-head"><h3 id="qrModalTitle">📱 Inquadra per giocare</h3><button class="btn btn-icon" onclick="closeM('qrModal')">✕</button></div>
    <div class="sheet-body">
      <div class="qr-wrap">
        <div id="qrBox" class="qr-box"></div>
        <div id="qrCount" class="bold" style="color:var(--good)"></div>
        <div style="text-align:left;margin-top:.5rem"><label class="fl">Link partecipanti</label>
        <div class="row"><input id="qrUrl" class="inp" readonly><button class="btn" onclick="copyUrl()">📋</button></div></div>
        <button class="btn btn-primary btn-lg btn-block" onclick="startGameFromQr()">▶ Avvia partita</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ========== SHARED UTILS ========== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2, 9);
const load = k => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch { } };
const toast = (msg) => {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2500);
};
function openM(id) { $(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeM(id) { $(id).classList.remove('open'); document.body.style.overflow = ''; }

/* THEME */
function toggleMode() {
  const next = document.documentElement.dataset.mode === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.mode = next;
  store('gh_mode', next);
  $('modeBtn').textContent = next === 'light' ? '☀️' : '🌙';
}
function initTheme() {
  const m = load('gh_mode') === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.mode = m;
  $('modeBtn').textContent = m === 'light' ? '☀️' : '🌙';
}

/* QR Helper (shared) */
let currentRoomId = null;
function makeQr(text, elId) {
  const box = $(elId);
  if (!box) return;
  box.innerHTML = '';
  const size = Math.max(160, Math.min(innerWidth - 60, 340));
  if (window.QRCode) new QRCode(box, { text, width: size, height: size, colorDark: '#0f0c1b', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  else box.textContent = 'QR library missing';
}
function baseUrl() {
  const pub = load('gh_publicUrl');
  if (pub) { try { const u = new URL(pub); u.search = ''; u.hash = ''; return u.toString(); } catch { } }
  if (/^https?:$/.test(location.protocol) && !/^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)) return location.origin + location.pathname;
  return '';
}
function roomUrl(room) {
  const b = baseUrl();
  return b && room ? b + '?v=' + encodeURIComponent(room) : '';
}

/* ========== GAME REGISTRY ========== */
/* Ogni gioco: id, titolo, icona, categoria, giocatori, descrizione, init(container) */

  { id: 'erm', title: 'ERM, ACTUALLY!', icon: '⚠️', cat: 'Quiz', players: '2-10 squadre', desc: 'Trova gli errori nascosti nel testo letto dal conduttore. Chi urla “Erm, actually!” blocca la lettura.', init: initErm },
  { id: 'codenames', title: 'Codenames', icon: '🕵️', cat: 'Parole', players: '4-16', desc: 'Due squadre si sfidano identificando gli agenti tramite indizi di una sola parola.', init: initCodenames },
  { id: 'taboo', title: 'Taboo', icon: '🚫', cat: 'Parole', players: '4-12', desc: 'Fai indovinare la parola senza usare i termini vietati elencati sulla scheda.', init: initTaboo },
  { id: 'justone', title: 'Just One', icon: '👥', cat: 'Cooperativo', players: '3-7', desc: 'Tutti scrivono un indizio, i duplicati vengono eliminati e il giocatore indovina.', init: initJustOne },
  { id: 'dixit', title: 'Dixit', icon: '🎨', cat: 'Fantasia', players: '3-12', desc: 'Scegli una frase che descriva l’illustrazione senza essere né troppo ovvia né troppo oscura.', init: initPlaceholder },
  { id: 'telestrations', title: 'Telestrations', icon: '📞', cat: 'Disegno', players: '4-8', desc: 'Disegna e passa: il telefono viaggia di mano in mano tra disegno e didascalia.', init: initPlaceholder },
  { id: 'scattergories', title: 'Scattergories', icon: '📝', cat: 'Velocità', players: '2-8', desc: 'Lista di categorie e una lettera: trova parole che iniziano per quella lettera entro il tempo.', init: initPlaceholder },
  { id: 'pictionary', title: 'Pictionary', icon: '✏️', cat: 'Disegno', players: '4-16', desc: 'Disegna la parola per farla indovinare alla tua squadra.', init: initPlaceholder },
  { id: 'trivialpursuit', title: 'Trivial Pursuit', icon: '🎯', cat: 'Quiz', players: '2-6', desc: 'Rispondi a domande di cultura generale per guadagnare i colori del disco.', init: initPlaceholder },
  { id: 'cranium', title: 'Cranium', icon: '🧠', cat: 'Misto', players: '4-16', desc: 'Disegna, scolpisci, risolvi enigmi e canta per avanzare sul tabellone.', init: initPlaceholder },
  { id: 'balderdash', title: 'Balderdash', icon: '📖', cat: 'Bluff', players: '2-8', desc: 'Inventa definizioni false per parole oscure e cerca di indovinare quella vera.', init: initPlaceholder },
  { id: 'witswagers', title: 'Wits & Wagers', icon: '🎲', cat: 'Scommesse', players: '3-10', desc: 'Scommetti sulla risposta più vicina al valore corretto, anche se non lo sai.', init: initPlaceholder },

  { id: 'monikers', title: 'Monikers', icon: '🏷️', cat: 'Parole', players: '4-16', desc: 'Fai indovinare i nomi famosi con descrizione, una parola e mimo.', init: initPlaceholder },

/* ========== ROUTER ========== */
let currentGame = null;
let currentGameId = null;

function initFilters() {
  const cats = [...new Set(GAMES.map(g => g.cat))];
  const p = $('filterPills');
  p.innerHTML = `<button class="pill active" onclick="filterCat('Tutti')">Tutti</button>` + cats.map(c => `<button class="pill" onclick="filterCat('${esc(c)}')">${esc(c)}</button>`).join('');
}
function filterCat(cat) {
  document.querySelectorAll('#filterPills .pill').forEach(b => b.classList.toggle('active', b.textContent === cat));
  filterGames(cat);
}
function filterGames(cat = null) {
  const q = $('gameSearch').value.toLowerCase();
  const grid = $('gamesGrid');
  grid.innerHTML = GAMES.filter(g => (!cat || g.cat === cat) && (!q || g.title.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q))).map(g => `
    <div class="game-card">
      <div class="top"><span class="icon">${g.icon}</span><span class="cat">${esc(g.cat)}</span></div>
      <h3>${esc(g.title)}</h3>
      <p class="desc">${esc(g.desc)}</p>
      <div class="meta"><strong>Giocatori:</strong> ${esc(g.players)}</div>
      <button class="btn btn-primary btn-game" onclick="loadGame('${esc(g.id)}')">▶ Avvia</button>
    </div>
  `).join('');
}

function backToMenu() {
  if (currentGame && currentGame.stop) currentGame.stop();
  $('game-screen').classList.add('hidden');
  $('menu-screen').classList.remove('hidden');
  currentGame = null;
  currentGameId = null;
  $('game-container').innerHTML = '';
}

function loadGame(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) return;
  $('menu-screen').classList.add('hidden');
  $('game-screen').classList.remove('hidden');
  $('game-title').textContent = g.title;
  currentGameId = id;
  $('game-container').innerHTML = `<div class="muted small" style="text-align:center;margin-top:2rem">Caricamento ${esc(g.title)}…</div>`;
  setTimeout(() => {
    try {
      currentGame = g.init($('game-container'), g);
    } catch (e) {
      console.error(e);
      $('game-container').innerHTML = `<div class="panel"><div class="panel-title">Errore</div><p>${esc(e.message)}</p><button class="btn" onclick="backToMenu()">Torna al menu</button></div>`;
    }
  }, 50);
}

function initCodenames(container, g) {
  const words = ['Sole','Luna','Mare','Montagna','Bosco','Fiume','Città','Stella','Cielo','Cuore','Libro','Treno','Orologio','Chiave','Porta','Finestra','Tavolo','Sedia','Palla','Cane','Gatto','Uccello','Pesce','Albero','Fiori','Caffè','Tè','Pane','Latte','Miele','Zucchero','Sale','Pepe','Olio','Vino','Acqua','Gelo','Fuoco','Terra','Aria','Vento','Pioggia','Neve','Tuono','Lampo','Ombra','Luce','Specchio','Sogno','Notte','Giorno','Mattina','Sera','Pranzo','Cena'];
  const teamWords = shuffle(words).slice(0, 25);
  let red = 8, blue = 8, neutral = 7, assassin = 1;
  let revealed = new Array(25).fill(false);
  let turn = 'red';
  let gameOver = false;

  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
  function cellType(i){
    if(i<red)return 'red';
    if(i<red+blue)return 'blue';
    if(i<red+blue+neutral)return 'neutral';
    return 'assassin';
  }
  function render(){
    let html = `<div class="panel"><div class="panel-title">Codenames — ${turn === 'red' ? '🔴 Squadra Rossa' : '🔵 Squadra Blu'} tocca</div>
      <div style="display:flex;gap:.4rem;justify-content:center;margin-bottom:1rem">
        <span class="chip ${turn==='red'?'chip-accent':''}">🔴 Rosso: ${red}</span>
        <span class="chip ${turn==='blue'?'chip-accent':''}">🔵 Blu: ${blue}</span>
        <span class="chip">⚪ Neutrali: ${neutral}</span>
        <span class="chip chip-bad">💀 Assassino: ${assassin}</span>
      </div>
      <div class="card-grid">`;
    for(let i=0;i<25;i++){
      const t = cellType(i);
      const cls = revealed[i] ? 'done ' + (t==='red'?'bg-good':t==='blue'?'bg-good':'bg-neutral') : '';
      html += `<button class="tile ${cls}" onclick="cnReveal(${i})">${esc(teamWords[i])}</button>`;
    }
    html += `</div><div class="row center" style="margin-top:1rem"><input id="cnClue" class="inp" placeholder="Indizio (una parola)" style="max-width:220px"><input id="cnNum" type="number" class="inp" placeholder="#" min="1" style="max-width:60px"><button class="btn btn-primary" onclick="cnSetClue()">Imposta indizio</button></div>
    <div class="row center" style="margin-top:.5rem"><button class="btn btn-bad" onclick="cnEndTurn()">Cambia turno</button><button class="btn btn-sm" onclick="backToMenu()">✕ Esci</button></div></div>`;
    container.innerHTML = html;
    // add background classes via JS since CSS lacks them (inject tiny style)
    if(!document.getElementById('cn-style')){
      const s=document.createElement('style');s.id='cn-style';s.textContent=`.bg-good{background:var(--good)!important;color:#04251a!important;border-color:var(--good)}.bg-neutral{background:#9ca3af!important;color:#fff!important;border-color:#9ca3af}.done{opacity:1}.tile{aspect-ratio:1;display:grid;place-items:center;font-weight:900;font-size:1.1rem;text-transform:uppercase}`;document.head.appendChild(s);
    }
  }
  window.cnReveal = (i) => {
    if(gameOver || revealed[i]) return;
    revealed[i]=true;
    const t=cellType(i);
    if(t==='red'){red--; if(turn==='red'){if(red===0){gameOver=true;toast('🏆 Squadra Rossa vince!');}}}
    else if(t==='blue'){blue--; if(turn==='blue'){if(blue===0){gameOver=true;toast('🏆 Squadra Blu vince!');}} turn='red';}
    else if(t==='neutral'){neutral--; turn = turn==='red'?'blue':'red';}
    else {assassin--; gameOver=true; toast('💀 Assassino trovato! Squadra avversaria vince.');}
    render();
  };
  window.cnSetClue = () => {
    const clue = $('cnClue').value.trim(); const num = $('cnNum').value.trim();
    if(!clue){toast('Scrivi un indizio');return}
    toast(`Indizio impostato: ${clue} (${num})`);
    $('cnClue').value=''; $('cnNum').value='';
  };
  window.cnEndTurn = () => { turn = turn==='red'?'blue':'red'; render(); };
  render();
  return { stop:()=>{ window.cnReveal=null; window.cnSetClue=null; window.cnEndTurn=null; } };
}

function initTaboo(container, g) {
  const cards = [
    { word: 'Pizza', forbidden: ['Pomodoro','Formaggio','Forno','Italia','Margherita'] },
    { word: 'Telefono', forbidden: ['Chiamata','Schermo','Android','Apple','Numeri'] },
    { word: 'Caffè', forbidden: ['Tazza','Barista','Espresso','Mattina','Bevanda'] },
    { word: 'Aereo', forbidden: ['Volo','Aeroporto','Pilota','Cielo','Viaggio'] },
    { word: 'Cioccolato', forbidden: ['Dolce','Cacao','Uovo','Pasqua','Barretta'] }
  ];
  let idx=0, score=0, timeLeft=60, timer=null;
  function render(){
    if(idx>=cards.length){container.innerHTML=`<div class="panel" style="text-align:center"><h2>⏱️ Tempo scaduto!</h2><p>Punteggio: <strong>${score}</strong></p><button class="btn btn-primary" onclick="backToMenu()">Menu</button></div>`;return}
    const c=cards[idx];
    container.innerHTML=`
      <div class="panel" style="text-align:center">
        <div style="font-size:2.5rem;margin-bottom:.5rem">${g.icon}</div>
        <div class="row between" style="margin-bottom:1rem"><span class="chip chip-accent">⏱️ ${timeLeft}s</span><span class="chip">⭐ ${score}</span></div>
        <div style="font-size:2.2rem;font-family:Outfit;font-weight:900;color:var(--acc);margin:1rem 0">${esc(c.word)}</div>
        <div class="panel-title">Parole proibite (non pronunciarle)</div>
        <div class="chips" style="justify-content:center">${c.forbidden.map(w=>`<span class="chip chip-bad">${esc(w)}</span>`).join('')}</div>
        <div class="row center" style="margin-top:1rem;gap:.4rem">
          <button class="btn btn-good" onclick="tabooOk()">✅ Indovinata</button>
          <button class="btn btn-bad" onclick="tabooSkip()">❌ Saltata</button>
        </div>
        <button class="btn btn-sm" onclick="backToMenu()" style="margin-top:.6rem">✕ Esci</button>
      </div>`;
    if(!timer){timer=setInterval(()=>{timeLeft--;if(timeLeft<=0){clearInterval(timer);render();}else{$('tabooTime')&&($('tabooTime').textContent=timeLeft);}},1000);}
    // patch time element id
    setTimeout(()=>{const el=document.querySelector('.chip-accent');if(el)el.id='tabooTime';},0);
  }
  window.tabooOk=()=>{score++;idx++;render();};
  window.tabooSkip=()=>{idx++;render();};
  render();
  return {stop:()=>{clearInterval(timer);window.tabooOk=null;window.tabooSkip=null;}};
}

        <div class="panel-title">${stage==='clue'?'Scrivi il tuo indizio (una parola)':stage==='dedup'?'Elimina i duplicati':'Indovina la parola segreta'}</div>
        ${stage==='clue'?`<input id="jiClue" class="inp" placeholder="Il tuo indizio…" style="max-width:260px;display:inline-block"><button class="btn btn-primary" onclick="jiSubmitClue()">Invia</button>`:''}
        ${stage==='dedup'?`<div id="jiList" class="stack" style="gap:.4rem">${clues.map((c,i)=>`<div class="row between"><span>${esc(c)}</span><button class="btn btn-sm btn-bad" onclick="jiRemove(${i})">🗑</button></div>`).join('')}</div><button class="btn btn-primary" onclick="jiConfirmDedup()">Conferma</button>`:''}
        ${stage==='guess'?`<div style="font-size:2rem;font-family:Outfit;font-weight:800;color:var(--acc);margin:1rem 0">? ${secret.length} lettere</div><input id="jiGuess" class="inp" placeholder="La tua risposta" style="max-width:260px;display:inline-block"><button class="btn btn-primary" onclick="jiSubmitGuess()">Indovina</button>`:''}
        <p class="muted small">Parola segreta (solo per test conduttore): <strong>${esc(secret)}</strong></p>
        <button class="btn btn-sm" onclick="backToMenu()" style="margin-top:.6rem">✕ Esci</button>
      </div>`;
  }
  window.jiSubmitClue=()=>{const v=$('jiClue').value.trim();if(!v)return;clues.push(v);$('jiClue').value='';stage='dedup';render();};
  window.jiRemove=(i)=>{clues.splice(i,1);render();};
  window.jiConfirmDedup=()=>{stage='guess';render();};
  window.jiSubmitGuess=()=>{const v=$('jiGuess').value.trim();if(v.toLowerCase()===secret.toLowerCase()){toast('🎉 Corretto!');wordIdx++;if(wordIdx>=words.length){toast('Partita completata!');backToMenu();return}}secret=words[wordIdx];clues=[];stage='clue';render();};
  render();
  return {stop:()=>{window.jiSubmitClue=null;window.jiRemove=null;window.jiConfirmDedup=null;window.jiSubmitGuess=null;}};
}

/* ========== JEOPARDY LITE (host + local audience simulation) ========== */
function initJeopardy(container, g) {
  const cats = [
    {id:'geo',title:'Geografia',emoji:'🌍',cards:[
      {id:'g1',points:200,question:'Qual è il fiume più lungo d\'Italia?',answer:'Il Po'},
      {id:'g2',points:400,question:'Qual è la capitale dell\'Australia?',answer:'Canberra'},
      {id:'g3',points:600,question:'Qual è il deserto caldo più grande del mondo?',answer:'Il Sahara'}
    ]},
    {id:'sci',title:'Scienza',emoji:'🔬',cards:[
      {id:'s1',points:200,question:'Simbolo chimico dell\'oro?',answer:'Au'},
      {id:'s2',points:400,question:'Pianeta più vicino al Sole?',answer:'Mercurio'},
      {id:'s3',points:600,question:'Quante ossa ha il corpo umano adulto?',answer:'206'}
    ]}
  ];
  let players=[{id:1,name:'Squadra 1',score:0},{id:2,name:'Squadra 2',score:0}];
  let activeId=1, completed={}, cur=null;
  function save(){store('jp_game',{players,activeId,completed});}
  function render(){
    let html=`<div class="panel"><div class="panel-title">🏆 Squadre</div>
      <div class="list-scroll" style="max-height:40vh">${players.map(p=>`
        <div class="prow ${p.id===activeId?'active':''}">
          <button class="act-btn" onclick="jpSetActive(${p.id})">${p.id===activeId?'●':'○'}</button>
          <span class="pname" onclick="jpRename(${p.id})">${esc(p.name)}</span>
          <span class="pscore" onclick="jpSetScore(${p.id})">${p.score}</span>
          <div class="padj"><button class="btn btn-sm" onclick="jpAdj(${p.id},50)">+50</button><button class="btn btn-sm" onclick="jpAdj(${p.id},-50)">−50</button></div>
        </div>`).join('')||'<div class="empty">Nessuna squadra</div>'}</div>
      <div class="row center" style="margin-top:.6rem"><button class="btn btn-sm btn-violet" onclick="jpAddPlayer()">+ Squadra</button><button class="btn btn-sm btn-soft-bad" onclick="jpReset()">🔄 Reset</button></div>
    </div>
    <div class="panel"><div class="panel-title">📋 Tabellone</div>
      <div class="board-scroll"><div class="board" style="grid-template-columns:repeat(${cats.length},1fr)">${cats.map(c=>`
        <div class="cat-col"><div class="cat-head">${c.emoji}<h3>${esc(c.title)}</h3></div>
        ${c.cards.map(k=>`<button class="tile ${completed[k.id]?'tile-done':''}" onclick="jpOpenCard('${k.id}')">${k.points}</button>`).join('')}
        </div>`).join('')}</div></div>
      <div class="row center" style="margin-top:.6rem"><button class="btn btn-primary" onclick="jpOpenQr()">📱 QR per telefoni</button><button class="btn btn-sm" onclick="backToMenu()">✕ Esci</button></div>
    </div>`;
    container.innerHTML=html;
    if(!document.getElementById('jp-style')){
      const s=document.createElement('style');s.id='jp-style';s.textContent=`.jp-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,5,12,.75)}.jp-modal.open{display:flex}.jp-sheet{width:90%;max-width:700px;max-height:90vh;background:var(--sfc);border:1px solid var(--bd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.jp-head{padding:.7rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.jp-body{padding:1rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:.8rem}.reading{font-size:1.2rem;line-height:1.7;padding:1rem;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--bd);white-space:pre-wrap}.answer-box{padding:1rem;border-radius:12px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.45);font-size:1rem;margin-top:.6rem}.judge-btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}`;document.head.appendChild(s);
    }
  }
  window.jpSetActive=(id)=>{activeId=id;save();render();};
  window.jpRename=(id)=>{const p=players.find(x=>x.id===id);const n=prompt('Nuovo nome:',p.name);if(n){p.name=n.trim().slice(0,30);save();render();}};
  window.jpSetScore=(id)=>{const p=players.find(x=>x.id===id);const v=prompt('Punteggio:',p.score);const n=parseInt(v,10);if(!isNaN(n)){p.score=n;save();render();}};
  window.jpAdj=(id,amt)=>{const p=players.find(x=>x.id===id);p.score+=amt;save();render();};
  window.jpAddPlayer=()=>{const n=prompt('Nome squadra:','Squadra '+(players.length+1));if(n)players.push({id:Date.now(),name:n.trim().slice(0,30),score:0});save();render();};
  window.jpReset=()=>{if(confirm('Reset partita?')){players.forEach(p=>p.score=0);completed={};cur=null;save();render();}};
  window.jpOpenCard=(id)=>{
    const cat=cats.find(c=>c.cards.find(k=>k.id===id));const card=cat.cards.find(k=>k.id===id);
    cur={id,card,catTitle:cat.title,phase:'read'};
    container.innerHTML+=`<div class="jp-modal open" id="jpModal"><div class="jp-sheet"><div class="jp-head"><div><div class="chip">${esc(cur.catTitle)}</div><div class="chip chip-acc">${cur.card.points} pt</div></div><button class="btn btn-icon" onclick="jpCloseCard()">✕</button></div><div class="jp-body"><div class="panel"><div class="panel-title">🎤 Domanda</div><div class="reading">${esc(cur.card.question)}</div></div><div class="answer-box hidden" id="jpAnswerBox"><div class="small muted bold" style="letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem">Risposta</div><div id="jpAnswer">${esc(cur.card.answer)}</div></div><div class="row center"><button class="btn btn-primary" onclick="jpReveal()">Rivela risposta</button><button class="btn btn-good" onclick="jpCorrect()">✅ Corretto (+${cur.card.points})</button><button class="btn btn-bad" onclick="jpWrong()">❌ Sbagliato (−${cur.card.points})</button></div><div class="row center" style="margin-top:.4rem"><button class="btn" onclick="jpComplete()">✅ Completa tessera</button></div></div></div></div>`;
  };
  window.jpReveal=()=>{$('jpAnswerBox').classList.remove('hidden');};
  window.jpCorrect=()=>{const p=players.find(x=>x.id===activeId);p.score+=cur.card.points;save();cur.phase='done';toast('Corretto!');jpCloseCard();};
  window.jpWrong=()=>{const p=players.find(x=>x.id===activeId);p.score-=cur.card.points;save();cur.phase='done';toast('Sbagliato');jpCloseCard();};
  window.jpComplete=()=>{completed[cur.id]=true;save();cur=null;jpCloseCard();render();};
  window.jpCloseCard=()=>{const m=document.getElementById('jpModal');if(m)m.remove();cur=null;};
  window.jpOpenQr=()=>{openQr('jeopardy-room-'+uid(),'🎤 Jeopardy! — Inquadra per giocare');};
  render();
  return {stop:()=>{window.jpSetActive=null;window.jpRename=null;window.jpSetScore=null;window.jpAdj=null;window.jpAddPlayer=null;window.jpReset=null;window.jpOpenCard=null;window.jpReveal=null;window.jpCorrect=null;window.jpWrong=null;window.jpComplete=null;window.jpCloseCard=null;window.jpOpenQr=null;}};
}

/* ========== ERM ACTUALLY LITE ========== */
function initErm(container, g) {
  const cards = [
    { id:'e1', points:100, text: 'Il *Tevere* è il fiume più lungo d\'Italia. Il Monte Bianco si trova al confine tra Italia e *Svizzera*. La capitale dell\'Australia è *Sydney*.', solutions:[{err:'Tevere',corr:'Il fiume più lungo d\'Italia è il **Po**'},{err:'Svizzera',corr:'Il Monte Bianco è al confine con la **Francia**'},{err:'Sydney',corr:'La capitale dell\'Australia è **Canberra**'}] },
    { id:'e2', points:200, text: 'L\'acqua bolle a *90* °C al livello del mare. Il simbolo chimico dell\'oro è *Ag*. Il pianeta più vicino al Sole è *Venere*.', solutions:[{err:'90',corr:'L\'acqua bolle a **100** °C'},{err:'Ag',corr:'Il simbolo dell\'oro è **Au**'},{err:'Venere',corr:'Il pianeta più vicino al Sole è **Mercurio**'}] }
  ];
  let players=[{id:1,name:'Squadra Alfa',score:0},{id:2,name:'Squadra Beta',score:0}];
  let activeId=1, completed={}, cur=null, solved=[];
  function save(){store('erm_game',{players,activeId,completed});}
  function render(){
    let html=`<div class="panel"><div class="panel-title">🏆 Squadre</div>
      <div class="list-scroll" style="max-height:40vh">${players.map(p=>`
        <div class="prow ${p.id===activeId?'active':''}">
          <button class="act-btn" onclick="ermSetActive(${p.id})">${p.id===activeId?'●':'○'}</button>
          <span class="pname" onclick="ermRename(${p.id})">${esc(p.name)}</span>
          <span class="pscore" onclick="ermSetScore(${p.id})">${p.score}</span>
          <div class="padj"><button class="btn btn-sm" onclick="ermAdj(${p.id},50)">+50</button><button class="btn btn-sm" onclick="ermAdj(${p.id},-50)">−50</button></div>
        </div>`).join('')}</div>
      <div class="row center" style="margin-top:.6rem"><button class="btn btn-sm btn-violet" onclick="ermAddPlayer()">+ Squadra</button><button class="btn btn-sm btn-primary" onclick="ermOpenQr()">📱 QR telefoni</button><button class="btn btn-sm btn-soft-bad" onclick="ermReset()">🔄 Reset</button></div>
    </div>
    <div class="panel"><div class="panel-title">🃏 Tessere</div>
      <div class="board-scroll"><div class="board" style="grid-template-columns:repeat(3,1fr)">${cards.map(c=>`<button class="tile ${completed[c.id]?'tile-done':''}" onclick="ermOpenCard('${c.id}')">${c.points}</button>`).join('')}</div></div>
      <button class="btn btn-sm" onclick="backToMenu()" style="margin-top:.6rem">✕ Esci</button>
    </div>`;
    container.innerHTML=html;
    if(!document.getElementById('erm-style')){
      const s=document.createElement('style');s.id='erm-style';s.textContent=`.erm-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(5,5,12,.75)}.erm-modal.open{display:flex}.erm-sheet{width:90%;max-width:720px;max-height:90vh;background:var(--sfc);border:1px solid var(--bd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.erm-head{padding:.7rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.erm-body{padding:1rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:.8rem}.err-list{display:flex;flex-direction:column;gap:.6rem}.err-item{display:flex;align-items:flex-start;gap:.8rem;padding:.8rem;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.03)}.err-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.8rem;background:var(--surface2,rgba(255,255,255,.05));flex-shrink:0}.err-item.ok .err-n{background:var(--good);color:#04251a}.err-txt{flex:1;min-width:0;font-size:.9rem}.err-btns{display:flex;flex-direction:column;gap:.4rem}`;document.head.appendChild(s);
    }
  }
  window.ermSetActive=(id)=>{activeId=id;save();render();};
  window.ermRename=(id)=>{const p=players.find(x=>x.id===id);const n=prompt('Nuovo nome:',p.name);if(n){p.name=n.trim().slice(0,30);save();render();}};
  window.ermSetScore=(id)=>{const p=players.find(x=>x.id===id);const v=prompt('Punteggio:',p.score);const n=parseInt(v,10);if(!isNaN(n)){p.score=n;save();render();}};
  window.ermAdj=(id,amt)=>{const p=players.find(x=>x.id===id);p.score+=amt;save();render();};
  window.ermAddPlayer=()=>{const n=prompt('Nome squadra:','Squadra '+(players.length+1));if(n)players.push({id:Date.now(),name:n.trim().slice(0,30),score:0});save();render();};
  window.ermReset=()=>{if(confirm('Reset?')){players.forEach(p=>p.score=0);completed={};cur=null;save();render();}};
  window.ermOpenCard=(id)=>{
    const c=cards.find(x=>x.id===id);cur=c;solved=c.solutions.map(()=>false);
    container.innerHTML+=`<div class="erm-modal open" id="ermModal"><div class="erm-sheet"><div class="erm-head"><div>${esc(c.points)} punti</div><button class="btn btn-icon" onclick="ermCloseCard()">✕</button></div><div class="erm-body"><div class="panel"><div class="panel-title">🎤 Testo da leggere</div><div class="reading" id="ermText"></div></div><div class="panel"><div class="panel-head"><div class="panel-title" style="margin:0">✅ Errori nascosti</div><button class="btn btn-sm" onclick="ermRevealAll()">Rivela tutti</button></div><div class="err-list" id="ermList"></div></div><div class="row center" style="margin-top:.6rem;gap:.4rem"><button class="btn btn-good" onclick="ermAward(1)">✅ + Punti pieni</button><button class="btn btn-bad" onclick="ermAward(-1)">❌ − Punti pieni</button></div><div class="row center" style="margin-top:.4rem"><input id="ermManual" type="number" class="inp" placeholder="Punti manuali" style="max-width:140px;display:inline-block"><button class="btn btn-sm" onclick="ermManualAward()">Applica</button></div><div class="row center" style="margin-top:.4rem"><button class="btn" onclick="ermComplete()">✅ Completa tessera</button></div></div></div></div>`;

  };
  window.ermToggleReveal=(i)=>{const li=$('ermList').children[i];const span=li.querySelector('.err-txt');const s=cur.solutions[i];span.innerHTML=solved[i]?`<span class="strike">${esc(s.err)}</span> → <strong>${esc(s.corr)}</strong>`:'<span class="muted" style="font-style:italic">Nascosto</span>';solved[i]=!solved[i];li.classList.toggle('ok',solved[i]);};
  window.ermToggleSolved=(i)=>{solved[i]=!solved[i];ermToggleReveal(i);toast(solved[i]?'Segnato corretto':'Rimosso');};
  window.ermRevealAll=()=>{cur.solutions.forEach((_,i)=>ermToggleReveal(i));};
  window.ermAward=(sign)=>{const p=players.find(x=>x.id===activeId);p.score+=sign*cur.points;save();toast(sign>0?'✅ Punti assegnati':'❌ Penale applicata');render();};
  window.ermManualAward=()=>{const v=parseInt($('ermManual').value,10);if(isNaN(v))return;const p=players.find(x=>x.id===activeId);p.score+=v;save();$('ermManual').value='';toast('Punti applicati');render();};
  window.ermComplete=()=>{completed[cur.id]=true;save();cur=null;document.getElementById('ermModal')?.remove();render();};
  window.ermCloseCard=()=>{document.getElementById('ermModal')?.remove();cur=null;};
  window.ermOpenQr=()=>{openQr('erm-room-'+uid(),'⚠️ ERM, ACTUALLY! — Inquadra per giocare');};
  render();
  return {stop:()=>{window.ermSetActive=null;window.ermRename=null;window.ermSetScore=null;window.ermAdj=null;window.ermAddPlayer=null;window.ermReset=null;window.ermOpenCard=null;window.ermToggleReveal=null;window.ermToggleSolved=null;window.ermRevealAll=null;window.ermAward=null;window.ermManualAward=null;window.ermComplete=null;window.ermCloseCard=null;window.ermOpenQr=null;}};
}
